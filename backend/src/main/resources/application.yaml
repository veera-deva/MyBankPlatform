spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5433/mybank
    username: mybank_dev
    password: mybank
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
  events:
    kafka:
      enabled: true
      topics:
        transaction-posted: banking.ledger.transaction-posted.v1
